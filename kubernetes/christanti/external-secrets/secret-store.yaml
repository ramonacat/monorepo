apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "https://vault.i.ramona.fun/"
      path: "secrets/kubernetes/christanti"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes-christanti
          role: "kv-kubernetes-christanti"
          serviceAccountRef:
            name: "vault-client"
            namespace: "external-secrets"
