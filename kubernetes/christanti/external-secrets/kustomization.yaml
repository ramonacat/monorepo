apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: external-secrets
    releaseName: external-secrets
    repo: "https://charts.external-secrets.io"
    namespace: external-secrets
    version: "2.15.0"
    valuesInline:
      replicaCount: 1
      # not needed when replicaCount=1, but keeping to avoid fucky wucky when it's increased
      leaderElect: true
      log:
        level: debug
      extraEnv:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca.pem
      extraVolumes:
        - name: ca-certs
          configMap:
            name: ca-certs
      extraVolumeMounts:
        - mountPath: /etc/ssl/certs/
          name: ca-certs
resources:
  - rbac.yaml
  - secret-store.yaml
  - service-account.yaml
