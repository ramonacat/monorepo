apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: vault
    releaseName: vault
    repo: "https://helm.releases.hashicorp.com"
    namespace: vault
    version: "0.34.1"
    valuesInline:
      global:
        tlsDisable: false
        externalVaultAddr: "https://vault.i.ramona.fun/"
      injector:
        replicas: 2
        authPath: 'auth/kubernetes-christanti'
