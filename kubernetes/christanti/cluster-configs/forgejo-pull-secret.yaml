apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: forgejo-container-credentials
spec:
  namespaceSelectors:
    - matchExpressions:
        - key: k8s.ramona.fun/no-image-pull-secrets
          operator: DoesNotExist
  refreshTime: 1m
  externalSecretSpec:
    target:
      name: forgejo-container-credentials
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: '{{ index . "docker-config-json" | toString }}'
    dataFrom:
      - sourceRef:
          storeRef:
            kind: ClusterSecretStore
            name: vault
        extract:
          key: forgejo-container-registry-config
