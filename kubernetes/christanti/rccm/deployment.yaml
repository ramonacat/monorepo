apiVersion: apps/v1
kind: Deployment
metadata:
  name: rccm
  namespace: rccm
  labels:
    app: rccm
spec:
  selector:
    matchLabels:
      app: rccm
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rccm
    spec:
      tolerations:
        - key: "node.cloudprovider.kubernetes.io/uninitialized"
          value: "true"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/network-unavailable"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: forgejo-container-credentials
      dnsPolicy: Default
      containers:
      - name: rccm
        image: code.ramona.fun/ramona/monorepo/rccm:1795341802
        imagePullPolicy: IfNotPresent
        env:
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/ca.pem
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        args:
          - /bin/rccm
          - --cloud-provider=ramona
          - --cluster-cidr=10.65.0.0/16
        volumeMounts:
          - mountPath: /etc/ssl/certs/
            name: ca-certs
      volumes:
        - name: ca-certs
          configMap:
            name: ca-certs
      restartPolicy: Always
---

