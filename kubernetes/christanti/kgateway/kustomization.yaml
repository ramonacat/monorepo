apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kgateway-system
helmCharts:
  - name: kgateway-crds
    releaseName: kgateway-crds
    repo: "oci://cr.kgateway.dev/kgateway-dev/charts/"
    namespace: kgateway-system
    version: "2.5.2"
  - name: kgateway
    releaseName: kgateway
    repo: "oci://cr.kgateway.dev/kgateway-dev/charts/"
    namespace: kgateway-system
    version: "2.5.2"
resources:
  - gateway-i/gateway.yaml
  - http-to-https.yaml
  - namespace.yaml
