apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    auth:
      kubernetes:
        role: cert-manager-christanti
        mountPath: /v1/auth/kubernetes-christanti
        serviceAccountRef:
          name: cert-manager
          audiences:
            - https://kubernetes.default.svc.cluster.local
    path: pki-internal/sign/internal
    server: https://vault.i.ramona.fun/
