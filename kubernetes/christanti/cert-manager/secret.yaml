apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-webhook-dnsimple
spec:
  refreshInterval: 1m
  target:
    name: dnsimple-token
    creationPolicy: Owner
    template:
      data:
        token: '{{ .TOKEN }}'
  dataFrom:
    - sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: vault
      extract:
        key: cert-manager/dnsimple-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
