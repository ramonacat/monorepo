apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: cert-manager
    releaseName: cert-manager
    repo: "oci://quay.io/jetstack/charts"
    namespace: cert-manager
    version: "v1.21.3"
    valuesInline:
      crds:
        enabled: true
      replicaCount: 1
      enableCertificateOwnerRef: true
      config: 
        enableGatewayAPI: true
      extraEnv:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca.pem
      volumes:
        - name: ca-certs
          configMap:
            name: ca-certs
      volumeMounts:
        - mountPath: /etc/ssl/certs/
          name: ca-certs
  - name: cert-manager-webhook-dnsimple
    releaseName: cert-manager-webhook-dnsimple
    repo: https://puzzle.github.io/cert-manager-webhook-dnsimple
    namespace: cert-manager
    valuesInline:
      dnsimple:
        existingTokenSecret: true
        tokenSecretName: dnsimple-token
      clusterIssuer:
        email: ramona@luczkiewi.cz
        production:
          enabled: true
        staging:
          enabled: true
  - name: trust-manager
    releaseName: trust-manager
    repo: "oci://quay.io/jetstack/charts"
    namespace: cert-manager
    version: "v0.26.0"
resources:
  - bundle.yaml
  - issuer.yaml
  - rbac.yaml
  - secret.yaml
  - service-account.yaml
