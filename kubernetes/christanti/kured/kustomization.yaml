apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: kured
    releaseName: kured
    repo: "https://kubereboot.github.io/charts"
    namespace: kured
    version: "6.1.0"
    valuesInline:
      configuration:
        rebootCommand: "/run/current-system/sw/bin/systemctl reboot"
        period: "1m0s"
        lockReleaseDelay: "10m0s"

