apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: ssh
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-public
    namespace: kgateway-system
  listeners:
    - name: ssh
      port: 22
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
---
