apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attic
spec:
  parentRefs:
  - name: gateway-tailscale
    namespace: kgateway-system
    group: gateway.networking.k8s.io
  hostnames:
    - attic.infrastructure.ramona.fun
  rules:
    - backendRefs:
      - name: attic
        kind: Service
        port: 80
        group: ""
        weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        backendRequest: "7200s"
        request: "7200s"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: attic
spec:
  targetRefs:
    - group: ''
      kind: Service
      name: attic
  commonHttpProtocolOptions:
    maxStreamDuration: "7200s"
