apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  attic.conf: |-
    listen = "0.0.0.0:8080"
    allowed-hosts = ["attic.infrastructure.ramona.fun", "attic.i.ramona.fun"]
    api-endpoint = "https://attic.i.ramona.fun/"
    
    [storage]
    type = "local"
    path = "/var/data/"
    
    [database]
    [chunking]
    nar-size-threshold = 262144 # chunk files that are 64 KiB or larger
    min-size = 524288
    avg-size = 1048576
    max-size = 2097152
