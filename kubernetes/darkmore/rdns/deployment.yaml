apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdns
  labels:
    app: rdns
spec:
  selector:
    matchLabels:
      app: rdns
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: rdns
      labels:
        app: rdns
    spec:
      imagePullSecrets:
        - name: forgejo-container-credentials
      containers:
      - name: rdns
        image: code.ramona.fun/ramona/monorepo/rdns:1793884456
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 25m
            memory: 15Mi
          limits:
            cpu: 100m
            memory: 100Mi
        # todo add liveness/readiness probes
        ports:
        - containerPort: 53
          name: dns-tcp
        - containerPort: 53
          protocol: UDP
          name: dns-udp
      restartPolicy: Always
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-container-credentials
spec:
  target:
    name: forgejo-container-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ index . "docker-config-json" | toString }}'
  dataFrom:
    - sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: vault
      extract:
        key: forgejo-container-registry-config
