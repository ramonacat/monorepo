apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-storage
spec:
  target:
    name: object-storage
    creationPolicy: Owner
    template:
      data:
        cloud: '{{ .cloud }}'
  dataFrom:
    - sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: vault
      extract:
        key: velero/object-storage
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
