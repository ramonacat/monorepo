apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: polaris
spec:
  parentRefs:
  - name: gateway-i
    namespace: kgateway-system
    group: gateway.networking.k8s.io
  hostnames:
    - polaris.i.ramona.fun
  rules:
    - backendRefs:
      - name: polaris-dashboard
        kind: Service
        port: 80
        group: ""
        weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
