apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: services-all
  namespace: roperator
rules:
  - apiGroups: ['']
    resources: ['services']
    verbs: ['list', 'watch', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: 
  name: roperator
subjects:
- kind: ServiceAccount
  name: default
  namespace: roperator
roleRef:
  kind: ClusterRole
  name: services-all
  apiGroup: ''
