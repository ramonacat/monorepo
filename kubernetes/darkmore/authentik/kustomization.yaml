apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: authentik
    releaseName: authentik
    namespace: authentik
    repo: https://charts.goauthentik.io
    version: "2026.5.6"
    valuesInline:
      authentik:
        email:
          from: roboramona <roboramona@luczkiewi.cz>
          host: smtp.fastmail.com
          port: 465
          use_ssl: true
          username: ramona@luczkiewi.cz
        error_reporting:
          enabled: true
        postgresql:
          host: cloudnative-pg-database-cluster-pooler-rw.cloudnative-pg-database
          name: authentik
          port: 5432
      global:
        env:
        - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__HOST
          value: cloudnative-pg-database-cluster-pooler-ro.cloudnative-pg-database
        - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__PORT
          value: "5432"
        envFrom:
        - secretRef:
            name: authentik-env-secrets
      prometheus:
        rules:
          enabled: true
      server:
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
        replicas: 2
        route:
          main:
            enabled: true
            hostnames:
            - account.ramona.fun
            parentRefs:
            - name: gateway-public
              namespace: kgateway-system
              group: gateway.networking.k8s.io
              kind: Gateway
      worker:
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
        replicas: 2
