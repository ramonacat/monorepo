apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  # todo the forward zones should be generated for each dns_zone that is configured in ras
  unbound.conf: |-
    server:
      username: ""
      chroot: ""
      interface-automatic: yes
      qname-minimisation: yes
      access-control: 10.0.0.0/8 allow
      log-servfail: yes
    forward-zone:
      name: i.ramona.fun
      forward-addr: 10.16.0.20
