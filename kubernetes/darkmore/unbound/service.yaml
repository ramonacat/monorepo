apiVersion: v1
kind: Service
metadata:
  name: unbound
  annotations:
    dns.ramona.fun/hostname: ns.i.ramona.fun
spec:
  selector:
    app: unbound
  type: LoadBalancer
  loadBalancerClass: ramona-internal
  ports:
  - name: dns-tcp
    protocol: TCP
    port: 53
    targetPort: 53
  - name: dns-udp
    protocol: UDP
    port: 53
    targetPort: 53

