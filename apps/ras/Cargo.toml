[package]
name = "ras"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rlib = { path = "../../libs/rust/rlib" }
ipnet = { version = "2.12.2", features = ["serde"] }
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["serde", "v7", "v8"] }
anyhow = "1.0.104"
sqlx = { version = "0.9.0", features = ["chrono", "ipnet", "migrate", "postgres", "runtime-tokio", "uuid"] }
