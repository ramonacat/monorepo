server:
    server-count: 2
    debug-mode: yes
    identity: {{ nameserver }}
    hide-version: yes
    statistics: 10
    reload-config: yes
    zonesdir: ""
    username: 1001
    verbosity: 2

{% for zone in zones -%}
    zone:
        name: {{ zone.name }}
        zonefile: {{ zone.filename }}
        # TODO use an actual key
        provide-xfr: 10.0.0.0/8 NOKEY
{%~ endfor %}
