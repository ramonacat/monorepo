server:
    server-count: 2
    debug-mode: yes
    identity: {{ nameserver }}
    hide-version: yes
    statistics: 10
    reload-config: yes
    zonesdir: ""
    username: 1001
    verbosity: 2
    request-xfr: 10.0.0.13 NOKEY

{% for zone in zones -%}
    zone:
        name: {{ zone.name }}
        zonefile: {{ zone.filename }}
{%~ endfor %}
