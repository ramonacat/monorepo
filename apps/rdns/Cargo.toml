[package]
name = "rdns"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
nix = { version = "0.31.3", features = ["signal"] }
rlib = { path = "../../libs/rust/rlib/" }
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v7"] }
