router id {{router_id}};


filter import_check {
    {{filter_import}}
}

filter export_check {
    {{filter_export}}
}

filter kernel_export {
    krt_prefsrc = {{preferred_source}};
    {{filter_import}}
}

protocol device {}

protocol kernel {
    learn all;

    ipv4 {
        import all;
        export filter kernel_export;
    };
}

protocol bfd {
}

protocol ospf v2 {
    area 0.0.0.0 {
        {% for interface in interfaces %}
        interface "{{interface.name_pattern}}" {
            cost {{interface.cost}};
            {% match interface.kind %}
            {% when RoutingInterfaceKind::Tunnel %}
            type ptp;
            bfd;
            {% when RoutingInterfaceKind::Broadcast %}
            type broadcast;
            bfd;
            {% when RoutingInterfaceKind::Passive %}
            stub;
            {% endmatch %}
        };
        {% endfor %}
    };

    ipv4 {
        import filter import_check;
        export filter export_check;
    };
}
{% if !static_routes.is_empty() %}
    protocol static {
        ipv4 { export all; };

        {% for route in static_routes %}
            {% if route.blackhole %}
                route {{ route.target_cidr }} blackhole;
            {% else %}
                route {{ route.target_cidr }} recursive {{ route.via }};
            {% endif %}
        {% endfor %}
    }
{% endif %}
{{ additional_config }}
