router id {{router_id}};

filter import_check {
    {{filter_import}}
}

filter export_check {
    {{filter_export}}
}

protocol device {}

protocol kernel {
    learn all;

    ipv4 {
        import all;
        export all;
    };
}

protocol bfd {
}

protocol ospf v2 {
    area 0.0.0.0 {
        {% for interface in interfaces %}
        interface "{{interface.name_pattern}}" {
            cost {{interface.cost}};
            {% if interface.is_tunnel %}
            type ptp;
            bfd;
            {% else %}
            stub;
            {% endif %}
        };
        {% endfor %}
    };

    ipv4 {
        import filter import_check;
        export filter export_check;
    };
}
{{ additional_config }}
