{% for denied_cidr in denied_cidrs %}
access-list filter deny {{ denied_cidr }}
{% endfor %}
access-list filter permit 0.0.0.0/0
route-map no-self permit 10
    match ip address filter
ip protocol any route-map no-self
router ospf
ospf router-id {{router_id}}
{% for interface in interfaces %}
interface {{ interface.name }}
    ip ospf area 0.0.0.0
    ip ospf cost {{ interface.cost }}
    {% if interface.is_tunnel %}
    ip ospf network point-to-point
    ip ospf bfd
    {% else %}
    ip ospf passive
    {% endif %}
{% endfor %}
