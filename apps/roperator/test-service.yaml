# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: test
  namespace: test
spec:
  selector:
    app: test
  type: LoadBalancer
  loadBalancerClass: ramona-local
  ports:
  - name: test
    protocol: TCP
    port: 80
    targetPort: 5000
---

