[package]
name = "roperator"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.2.0", features = ["runtime", "derive"] }
schemars = "1.2.3"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rlib = { path = "../../libs/rust/rlib/" }
uuid = { version = "1.29.0", features = ["v7"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
